# Publish sparrow-decider to PyPI with Trusted Publishing (OIDC). No API token is stored in GitHub.
#
# - A published GitHub release (tag vX.Y.Z matching pyproject.toml) -> test, build, publish to PyPI.
# - Manual run (Actions -> publish-pypi -> Run workflow) -> test, build, publish to TestPyPI by
#   default, or to PyPI if you pick "pypi".
#
# One-time setup is in publishing/PYPI.md: a pending trusted publisher on pypi.org (owner
# sparrow-decider, repo sparrow-decider, workflow publish-pypi.yml, environment pypi), the same on
# test.pypi.org with environment testpypi, and the two GitHub environments.
#
# Actions are pinned to commit SHAs (the tag is in the trailing comment).
name: publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Release tag must match pyproject version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'EOF'
          import os, tomllib
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"]
          if tag.lstrip("v") != v:
              raise SystemExit(f"release tag {tag!r} does not match pyproject version {v!r}")
          print(f"tag {tag} == version {v}")
          EOF
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Wheel must contain both bundled models
        run: |
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          need = ["sparrow_decider/models/sparrow-nano-general-v1.1.sparrow",
                  "sparrow_decider/models/sparrow-nano-robot-v1.2.sparrow"]
          missing = [n for n in need if n not in names]
          if missing:
              raise SystemExit(f"missing from wheel: {missing}")
          print(whl, "ok")
          EOF
      - name: Smoke-test the built wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import sparrow_decider as s; print(s.available_models()); s.Decider.load()"
          /tmp/smoke/bin/sparrow-decider --help > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sparrow-decider/
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/sparrow-decider/
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
