<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Sparrow Decider: decision models from 47 MB down to 6 KB">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <!-- grid of dots: the decision space -->
  <g fill="#334155">
    <circle cx="1000" cy="60" r="3"/><circle cx="1040" cy="60" r="3"/><circle cx="1080" cy="60" r="3"/><circle cx="1120" cy="60" r="3"/><circle cx="1160" cy="60" r="3"/><circle cx="1200" cy="60" r="3"/>
    <circle cx="1000" cy="100" r="3"/><circle cx="1040" cy="100" r="3"/><circle cx="1080" cy="100" r="3"/><circle cx="1120" cy="100" r="3"/><circle cx="1160" cy="100" r="3"/><circle cx="1200" cy="100" r="3"/>
    <circle cx="1000" cy="140" r="3"/><circle cx="1040" cy="140" r="3"/><circle cx="1080" cy="140" r="3"/><circle cx="1120" cy="140" r="3"/><circle cx="1160" cy="140" r="3"/><circle cx="1200" cy="140" r="3"/>
    <circle cx="1000" cy="180" r="3"/><circle cx="1040" cy="180" r="3"/><circle cx="1080" cy="180" r="3"/><circle cx="1120" cy="180" r="3"/><circle cx="1160" cy="180" r="3"/><circle cx="1200" cy="180" r="3"/>
    <circle cx="1000" cy="220" r="3"/><circle cx="1040" cy="220" r="3"/><circle cx="1080" cy="220" r="3"/><circle cx="1120" cy="220" r="3"/><circle cx="1160" cy="220" r="3"/><circle cx="1200" cy="220" r="3"/>
    <circle cx="1000" cy="260" r="3"/><circle cx="1040" cy="260" r="3"/><circle cx="1080" cy="260" r="3"/><circle cx="1120" cy="260" r="3"/><circle cx="1160" cy="260" r="3"/><circle cx="1200" cy="260" r="3"/>
  </g>
  <!-- a decision path through the grid -->
  <polyline points="1000,260 1040,220 1080,220 1120,140 1160,100 1200,60" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="1200" cy="60" r="7" fill="#f59e0b"/>
  <!-- geometric sparrow -->
  <g transform="translate(96 72)">
    <polygon points="40,96 112,40 168,72 120,128" fill="#94a3b8"/>          <!-- body -->
    <polygon points="112,40 152,8 184,40 168,72" fill="#cbd5e1"/>           <!-- head -->
    <polygon points="184,40 212,48 184,56" fill="#f59e0b"/>                 <!-- beak -->
    <circle cx="164" cy="34" r="5" fill="#0f172a"/>                         <!-- eye -->
    <polygon points="56,88 128,56 96,128 40,136" fill="url(#wing)"/>       <!-- wing -->
    <polygon points="40,96 0,112 24,128 40,136" fill="#64748b"/>           <!-- tail -->
    <line x1="104" y1="128" x2="96" y2="168" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <line x1="128" y1="122" x2="128" y2="168" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="352" y="150" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#f8fafc">Sparrow Decider</text>
  <text x="356" y="200" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#94a3b8">Decision models from 47 MB down to 6 KB.</text>
  <text x="356" y="240" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#94a3b8">Agents, robots and microcontrollers.</text>
</svg>
